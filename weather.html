<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市天气 - Apple 风格</title>
    <style>
        :root {
            --background: 0 0% 100%;
            --foreground: 0 0% 9%;
            --muted: 0 0% 96%;
            --muted-foreground: 0 0% 45%;
            --accent: 211 100% 50%;
            --accent-foreground: 0 0% 100%;
            --border: 0 0% 91%;
            --card-bg: rgba(255, 255, 255, 0.8);
            --ease-out: cubic-bezier(0.0, 0.0, 0.2, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: 0 0% 8%;
                --foreground: 0 0% 95%;
                --muted: 0 0% 12%;
                --muted-foreground: 0 0% 70%;
                --accent: 211 100% 65%;
                --border: 0 0% 20%;
                --card-bg: rgba(20, 20, 20, 0.8);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: hsl(var(--background));
            color: hsl(var(--foreground));
            line-height: 1.5;
            min-height: 100vh;
            padding: clamp(16px, 4vw, 32px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: clamp(32px, 8vw, 64px);
            animation: apple-fade-in 0.6s var(--ease-out) forwards;
        }

        h1 {
            font-size: clamp(2.25rem, 5vw, 3.5rem);
            font-weight: 600;
            letter-spacing: -0.025em;
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: clamp(0.875rem, 2vw, 1.125rem);
            color: hsl(var(--muted-foreground));
            font-weight: 400;
        }

        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .weather-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px) saturate(120%);
            -webkit-backdrop-filter: blur(20px) saturate(120%);
            border: 1px solid hsl(var(--border));
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.05);
            transition: all 0.3s var(--ease-out);
            animation: apple-fade-in 0.6s var(--ease-out) forwards;
            opacity: 0;
        }

        .weather-card:hover {
            transform: translateY(-0.5px);
            box-shadow: 0 4px 12px 0 rgb(0 0 0 / 0.08);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .city-name {
            font-size: clamp(1.125rem, 2.5vw, 1.5rem);
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .weather-icon {
            font-size: 2rem;
        }

        .current-temp {
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            font-weight: 600;
            letter-spacing: -0.025em;
            line-height: 1;
            margin-bottom: 4px;
        }

        .weather-condition {
            font-size: clamp(0.875rem, 2vw, 1rem);
            color: hsl(var(--muted-foreground));
            margin-bottom: 16px;
        }

        .forecast {
            border-top: 1px solid hsl(var(--border));
            padding-top: 16px;
        }

        .forecast-title {
            font-size: clamp(0.75rem, 1.5vw, 0.875rem);
            color: hsl(var(--muted-foreground));
            font-weight: 400;
            margin-bottom: 12px;
        }

        .forecast-days {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .forecast-day {
            text-align: center;
            flex: 1;
        }

        .forecast-date {
            font-size: clamp(0.75rem, 1.5vw, 0.875rem);
            color: hsl(var(--muted-foreground));
            margin-bottom: 4px;
        }

        .forecast-icon {
            font-size: 1.25rem;
            margin-bottom: 4px;
        }

        .forecast-temp {
            font-size: clamp(0.75rem, 1.5vw, 0.875rem);
            font-weight: 600;
        }

        @keyframes apple-fade-in {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .weather-card:nth-child(1) { animation-delay: 0.1s; }
        .weather-card:nth-child(2) { animation-delay: 0.2s; }
        .weather-card:nth-child(3) { animation-delay: 0.3s; }
        .weather-card:nth-child(4) { animation-delay: 0.4s; }
        .weather-card:nth-child(5) { animation-delay: 0.5s; }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

        <header>

            <!-- 广州 -->

            <!-- 北京 -->

    </div>
</body>
</html>
